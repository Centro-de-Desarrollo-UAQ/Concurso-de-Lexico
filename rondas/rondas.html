<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lexico - Rondas</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="rondas.css" />
  </head>

  <body>
    <div class="root">
      <div class="title">
        <img src="../imagen/Title.svg" alt="" />
      </div>

      <div class="main-buttons">
        <button class="button default-button" id="export-button">
          EXPORTAR RESPALDO
        </button>
        <button class="button default-button" id="import-button">
          IMPORTAR RESPALDO
        </button>
        <button class="button default-button" id="print-button">
          IMPRIMIR CLASIFICACIONES
        </button>
        <button class="button danger-button" id="reset-button">
          REINICIAR EVENTO
        </button>
      </div>

      <div class="content-container">
        <div class="switcher tab-switcher">
          <a href="../configuracion/configuracion.html">Configuracion</a>
          <a href="../equipos/equipos.html">Equipo</a>
          <a class="active" href="../rondas/rondas.html">Rondas</a>
          <a href="../clasificacion/clasificacion.html">Clasificaciones</a>
        </div>

        <div
          class="content-points"
          style="
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
          "
        >
          <div class="card">
            <span class="text-xl text-bold" id="numRondasGeneradas">0</span>
            <span class="text-base">Rondas Generadas</span>
          </div>
          <div class="card">
            <span class="text-xl text-bold" id="numRondasFinalizadas">0</span>
            <span class="text-base">Rondas Finalizadas</span>
          </div>
          <div class="card">
            <span class="text-xl text-bold" id="numRondasProgramadas">0</span>
            <span class="text-base">Rondas Programadas</span>
          </div>
          <div class="card">
            <span class="text-xl text-bold" id="numTotalEquipos">0</span>
            <span class="text-base">Equipos</span>
          </div>
        </div>

        <div class="content">
          <div class="switcher content-switcher" id="tabsRondas">
            <!-- Ronda 1, 2, 3... se generan solas con JS -->
          </div>

          <div id="listaEnfrentamientos">
            <!-- las tarjetas VS se generan solas con JS -->
          </div>

          <button class="button accent-button" id="btnSiguienteRonda">
            Generar Siguiente Ronda
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="../js/main-buttons.js"></script>
    <script type="module" src="rondas.js"></script>
  </body>
</html>
